<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포커 · 텍사스 홀덤</title><link rel="stylesheet" href="/style.css"><style>
.poker-wrap{max-width:1130px;margin:18px auto;padding:16px}.poker-wrap h1{font-size:38px}.poker-panel{background:#152d27;border:1px solid #bca477;border-radius:18px;padding:22px;margin:12px 0}.poker-table{background:radial-gradient(ellipse,#277459,#0b372b);border:17px solid #775031;border-radius:44% / 27%;box-shadow:0 12px 40px #0009;min-height:360px;padding:28px;text-align:center}.community,.hole{display:flex;justify-content:center;gap:8px;margin:18px 0}.pk-card{width:74px;height:104px;border-radius:9px;background:#fff9ec;color:#18271f;font-size:24px;font-weight:900;display:grid;place-items:center;border:2px solid #eee5d4;box-shadow:2px 5px 9px #0006}.pk-card.red{color:#c02735}.pk-card.back{background:repeating-linear-gradient(45deg,#1b5283,#1b5283 6px,#f0d6a1 7px,#f0d6a1 9px);color:transparent}.players{position:static!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.pk-player{background:#11241f;border:1px solid #937d56;border-radius:12px;padding:10px;text-align:center}.pk-player.turn{outline:2px solid #f5d28c}.pk-player.fold{opacity:.45}.pk-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.pk-actions input{width:115px}.pk-log{max-height:140px;overflow:auto;color:#bfcfc2;font-size:12px}.hidden{display:none!important}@media(max-width:650px){.pk-card{width:51px;height:75px;font-size:18px}.poker-table{border-width:8px;border-radius:80px;min-height:300px;padding:14px}.pk-player{font-size:12px}}</style></head><body><div class="poker-wrap"><a href="/" style="color:#f4d395">← 모드 선택</a><h1>♠ TEXAS <span>HOLD'EM</span></h1><p>클래식 텍사스 홀덤 · 2~6인 온라인 · 싱글 AI · 게임 칩 전용</p><section id="pkhome" class="poker-panel"><p>닉네임</p><input id="pkname" value="포커 플레이어" maxlength="14"><button id="pkcreate" class="primary">포커 방 만들기</button><div class="flex"><input id="pkcode" placeholder="방 코드"><button id="pkjoin">입장</button></div></section><section id="pkroom" class="hidden"><div class="poker-panel"><div id="pkstatus">대기 중</div><div id="pkplayers" class="players"></div><div class="pk-actions" id="pklobby"><button id="pkadd">AI 추가</button><button id="pkremove">AI 제거</button><button id="pkstart" class="primary">게임 시작</button></div></div><div class="poker-table"><h3 id="pkstreet"></h3><div id="pkpot">팟 0</div><div id="pkcommunity" class="community"></div><h3>내 카드</h3><div id="pkhand" class="hole"></div><p id="pkwin"></p></div><div class="poker-panel"><div id="pkturn"></div><div class="pk-actions" id="pkcontrols"><button id="pkfold">폴드</button><button id="pkcheck">체크</button><button id="pkcall">콜</button><input id="pkamount" type="number" min="20" value="40" step="10"><button id="pkraise" class="primary">레이즈</button></div><button id="pknext" class="primary hidden">다음 핸드</button><h3>진행 기록</h3><div id="pklog" class="pk-log"></div></div></section></div><script src="/poker.js"></script></body></html>
