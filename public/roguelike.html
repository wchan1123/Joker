<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>조커 던전 · 로그라이크</title><link rel="stylesheet" href="style.css"><style>
body{color:#f5e8ce}.rogue{max-width:1080px;margin:30px auto;padding:20px}.rogue h1{font-size:38px}.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.rbox{border:1px solid #aa9369;border-radius:16px;background:#142b26;padding:18px}.rhand{display:flex;overflow-x:auto;padding:15px;gap:4px}.rhand img,.enemydeck img{width:78px;height:112px;image-rendering:pixelated;cursor:pointer;transition:.18s}.enemydeck{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.enemydeck img:hover{transform:translateY(-10px)}.reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.reward{background:linear-gradient(135deg,#1c5242,#263c45);border:1px solid #dec089;padding:16px;text-align:center;min-height:150px}.reward b{display:block;color:#fdd58a;margin:10px}#roguelog{height:145px;overflow:auto;font-size:13px;color:#d1dbcb}.hp{height:16px;border-radius:20px;background:#522928;overflow:hidden}.hp div{height:100%;background:linear-gradient(90deg,#ba3137,#fc997b)}.hidden{display:none!important}@media(max-width:650px){.rgrid{grid-template-columns:1fr}.reward-grid{grid-template-columns:1fr}.rhand img,.enemydeck img{width:59px;height:86px}}</style></head><body><div class="rogue"><a href="/" style="color:#f8db9d">← 기본 조커뽑기</a><h1>🃏 조커 던전 <span>ROGUELIKE</span></h1><p>협동 생존 · 15스테이지 · 최대 6명 · 30종 증강 · 5스테이지마다 보스와 유물</p><div id="startscreen" class="rbox"><label>닉네임</label><input id="rname" value="모험가"><button id="rcreate" class="primary">생존 방 만들기</button><div class="flex"><input id="rcode" placeholder="방 코드"><button id="rjoin">방 입장</button></div></div><div id="rroom" class="hidden"><div class="rbox"><strong id="rstage"></strong><p id="rphase"></p><div id="rplayers"></div><button id="radd">AI 추가</button><button id="rremove">AI 제거</button><button id="rstart" class="primary">탐험 시작</button></div><div class="rgrid" style="margin-top:18px"><section class="rbox"><h2 id="renemy">몬스터</h2><div class="hp"><div id="renemyhp"></div></div><p id="renemystats"></p><div class="enemydeck" id="rdeck"></div></section><section class="rbox"><h2>내 패</h2><p id="rturn"></p><div id="rhand" class="rhand"></div><h3>전투 기록</h3><div id="roguelog"></div></section></div><section id="rewardbox" class="rbox hidden" style="margin-top:18px"><h2>✨ 보상을 선택하세요</h2><div id="rewards" class="reward-grid"></div></section><section id="rfinish" class="rbox hidden"></section></div></div><script src="/roguelike.js"></script></body></html>
