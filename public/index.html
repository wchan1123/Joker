<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도둑잡기 | 최대 6인 멀티 & AI</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">🃏 JOKER TABLE <small>PIXEL CARD CLUB</small></div><button id="sound" class="small">🔊 소리 켜짐</button></header><main><section id="home" class="panel"><h1>도둑<span>잡기</span></h1><p>친구들과 함께, 또는 AI와 혼자서! 최대 6인 카드 게임</p><label>닉네임</label><input id="name" maxlength="14" value="플레이어"/><button id="create" class="primary">방 만들기 · 싱글 / 멀티</button><div class="flex"><input id="code" maxlength="5" placeholder="5자리 방 코드"><button id="join">초대 코드 입장</button></div><small>싱글플레이는 방을 만든 다음 AI를 추가하면 돼요.</small></section><section id="lobby" class="panel hidden"><h2>게임 대기실</h2><div class="codebox" id="roomcode">-----</div><button id="copy">🔗 초대 링크 복사</button><p id="lobbyhint">친구와 AI를 합쳐 최대 6명까지 참가할 수 있어요.</p><div class="seats" id="lobbyseats"></div><div class="flex" id="hosttools"><button id="addai">＋ AI 추가</button><button id="removeai">－ AI 제거</button></div><button id="start" class="primary">🂠 카드 섞고 게임 시작</button><button id="exitlobby">나가기</button></section><section id="game" class="hidden"><div class="gamebar"><div><strong>ROUND <span id="round">1</span></strong><small id="gameroom">방 코드</small></div><div id="info">카드를 섞는 중</div><button id="exitgame">나가기</button></div><div class="table"><div class="wood"><div class="felt"><div class="players" id="players"></div><div class="centerpiece"><div class="discard-zone"><div id="discard-stack"></div><small id="discard-count">버린 카드 0장</small></div><div class="ornament">✦ ♠ ♥ ♣ ✦</div><div id="message">다른 플레이어를 기다리는 중...</div><small id="event"></small></div><div class="hand" id="mycards"></div><div id="fx" class="fx"></div></div></div></div><div class="statsbar"><span id="score">승 0 · 패 0 · 연승 0</span><span>상대 카드 클릭 → 뽑기</span></div></section><section id="end" class="panel hidden"><div class="trophy">🃏</div><h2 id="endtitle">게임 종료</h2><p id="endsub"></p><div id="ranking" class="ranking"></div><div id="myrecord"></div><button id="rematch" class="primary">다시 플레이</button><button id="exitend">방 나가기</button></section></main><div id="toast" class="toast hidden"></div><div id="jokerOverlay" class="jokerOverlay hidden"><div class="jokerReveal"><div>THE LAST JOKER</div><img id="jokerImg" src="cards/00.png" alt="마지막 조커"><h2 id="jokerName">조커의 주인</h2></div></div><script src="app.js"></script></body></html>
